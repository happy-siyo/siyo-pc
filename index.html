<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시은 PC방</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #24242c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      background: #18181d;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    p {
      margin: 0;
      color: #cccccc;
    }

    .test {
      margin: 50px auto;
      max-width: 500px;
      padding: 30px;
      background: #33333d;
      border-radius: 20px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 시은 PC방</h1>
    <p>우리 둘만의 PC방 주문 사이트</p>
  </header>

  <div class="test">
    <h2>사이트 연결 성공! 🎉</h2>
    <p>여기까지 보이면 정상적으로 작동하는 거야.</p>

    <button onclick="alert('버튼도 정상 작동해!')">
      테스트 버튼
    </button>
  </div>

</body>
</html>
